services:
  db:
    image: postgres:18
    container_name: demo12-db
    environment:
      POSTGRES_DB: application_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d application_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: demo12-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/application_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8081:8080"

volumes:
  postgres_data: