image: gradle:9.8.1-jdk21

stages:
  - verify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

verify:
  stage: verify
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon clean test bootJar
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/libs/*.jar
    reports:
      junit: build/test-results/test/*.xml
